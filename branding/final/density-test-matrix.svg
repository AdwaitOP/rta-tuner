<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Dark Wallpaper Gradient -->
    <radialGradient id="test-wall" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Clip Paths for Density Sizes -->
    <clipPath id="dp-squircle-64"><rect width="64" height="64" rx="17.6"/></clipPath>
    <clipPath id="dp-squircle-48"><rect width="48" height="48" rx="13.2"/></clipPath>
    <clipPath id="dp-squircle-32"><rect width="32" height="32" rx="8.8"/></clipPath>
    <clipPath id="dp-circle-24"><circle cx="12" cy="12" r="12"/></clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="icon-elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Reusable Base Graphic (Standard 64x64 Reference) -->
    <g id="dp-icon-full">
      <rect width="64" height="64" fill="#0C1019"/>
      <!-- Optical Centered Refined Emblem (Shifted +0.75px) -->
      <g transform="translate(0.75, 0)">
        <!-- Cabin C Shell -->
        <path d="
          M 45.2,21.5
          C 40.0,16.8 33.5,15.2 27.2,16.2
          C 19.8,17.5 14.8,23.8 14.8,32.0
          C 14.8,40.2 19.8,46.5 27.2,47.8
          C 33.5,48.8 40.0,47.2 45.2,42.5
          C 46.2,41.5 45.2,40.0 43.5,40.0
          C 39.5,40.0 35.5,42.8 29.2,43.5
          C 23.2,42.8 19.8,38.5 19.8,32.0
          C 19.8,25.5 23.2,21.2 29.2,20.5
          C 35.5,21.2 39.5,24.0 43.5,24.0
          C 45.2,24.0 46.2,22.5 45.2,21.5 Z"
          fill="#1E283A"
          stroke="#38BDF8"
          stroke-width="0.45"
        />
        <!-- Frequency Target Curve (Stroke width: 2.75px at 64dp = crisp, vibrant, zero blurring) -->
        <path d="
          M 17.5,32.2
          C 21.5,27.0 25.5,26.0 29.2,27.5
          C 32.0,28.8 33.5,33.2 37.0,34.0
          C 41.0,34.8 45.5,31.8 49.5,29.2"
          fill="none"
          stroke="#00E5FF"
          stroke-width="2.75"
          stroke-linecap="round"
        />
        <path d="
          M 17.5,32.2
          C 21.5,27.0 25.5,26.0 29.2,27.5
          C 32.0,28.8 33.5,33.2 37.0,34.0
          C 41.0,34.8 45.5,31.8 49.5,29.2"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="0.6"
          stroke-linecap="round"
          opacity="0.9"
        />
        <!-- Focal Point -->
        <circle cx="32.5" cy="31.8" r="1.8" fill="none" stroke="#00E5FF" stroke-width="0.4"/>
        <circle cx="32.5" cy="31.8" r="0.75" fill="#00E676"/>
      </g>
    </g>

    <!-- Reusable Monochrome Themed Graphic (64x64 Reference) -->
    <g id="dp-icon-mono">
      <rect width="64" height="64" fill="#202A37"/>
      <g transform="translate(0.75, 0)">
        <path d="
          M 45.2,21.5 C 40.0,16.8 33.5,15.2 27.2,16.2 C 19.8,17.5 14.8,23.8 14.8,32.0
          C 14.8,40.2 19.8,46.5 27.2,47.8 C 33.5,48.8 40.0,47.2 45.2,42.5 C 46.2,41.5 45.2,40.0 43.5,40.0
          C 39.5,40.0 35.5,42.8 29.2,43.5 C 23.2,42.8 19.8,38.5 19.8,32.0 C 19.8,25.5 23.2,21.2 29.2,20.5
          C 35.5,21.2 39.5,24.0 43.5,24.0 C 45.2,24.0 46.2,22.5 45.2,21.5 Z"
          fill="#DCE3F0"
        />
        <path d="M 17.5,32.2 C 21.5,27.0 25.5,26.0 29.2,27.5 C 32.0,28.8 33.5,33.2 37.0,34.0 C 41.0,34.8 45.5,31.8 49.5,29.2"
          fill="none" stroke="#DCE3F0" stroke-width="2.75" stroke-linecap="round"/>
        <circle cx="32.5" cy="31.8" r="1.8" fill="none" stroke="#DCE3F0" stroke-width="0.5"/>
        <circle cx="32.5" cy="31.8" r="0.8" fill="#DCE3F0"/>
      </g>
    </g>
  </defs>

  <!-- Ambient Display Background -->
  <rect width="1000" height="680" fill="url(#test-wall)"/>

  <!-- Top Title -->
  <text x="60" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">CabinRTA — Multi-Density Legibility Verification</text>
  <text x="60" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Testing genuine refined vector geometry at 64dp, 48dp, 32dp, and 24dp across full color and Material You dynamic theming.</text>

  <!-- ROW 1: FULL COLOR LAUNCHER ICONS -->
  <g transform="translate(60, 130)">
    <rect width="880" height="240" rx="16" fill="#0C111C" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="34" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">FULL-COLOR PRODUCTION VECTOR</text>

    <!-- 1. 64dp (xxhdpi Launcher) -->
    <g transform="translate(48, 65)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-64)">
          <use href="#dp-icon-full"/>
        </g>
      </g>
      <text x="32" y="85" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="32" y="105" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">64dp</text>
      <text x="32" y="122" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">xxhdpi app grid</text>
    </g>

    <!-- 2. 48dp (hdpi Launcher / Home Screen) -->
    <g transform="translate(240, 75)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-48)">
          <use href="#dp-icon-full" transform="scale(0.75)"/>
        </g>
      </g>
      <text x="24" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="24" y="95" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">48dp</text>
      <text x="24" y="112" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">hdpi launcher</text>
    </g>

    <!-- 3. 32dp (mdpi / Settings / App Drawer Item) -->
    <g transform="translate(430, 85)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-32)">
          <use href="#dp-icon-full" transform="scale(0.5)"/>
        </g>
      </g>
      <text x="16" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="16" y="85" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">32dp</text>
      <text x="16" y="102" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">settings row</text>
    </g>

    <!-- 4. 24dp (Status Bar / Quick Settings / Notification Chip) -->
    <g transform="translate(610, 89)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-circle-24)">
          <use href="#dp-icon-full" transform="scale(0.375)"/>
        </g>
      </g>
      <text x="12" y="61" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="12" y="81" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">24dp</text>
      <text x="12" y="98" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">notification/status</text>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(740, 50)" font-family="sans-serif" font-size="11">
      <rect width="110" height="150" rx="8" fill="#131B29" stroke="#1E293B"/>
      <text x="55" y="24" fill="#00E676" font-weight="700" text-anchor="middle">CONTRAST</text>
      <text x="12" y="48" fill="#CBD5E1">Curve: <tspan fill="#00E5FF" font-weight="700">14.2:1</tspan></text>
      <text x="12" y="70" fill="#CBD5E1">Shell: <tspan fill="#38BDF8" font-weight="700">8.4:1</tspan></text>
      <text x="12" y="92" fill="#CBD5E1">Stroke: <tspan fill="#FFFFFF" font-weight="700">22px</tspan></text>
      <text x="12" y="114" fill="#CBD5E1">Clutter: <tspan fill="#00E676" font-weight="700">Zero</tspan></text>
      <text x="12" y="136" fill="#00E676" font-weight="600">✓ Sharp at 24dp</text>
    </g>
  </g>

  <!-- ROW 2: ANDROID 13+ MATERIAL YOU MONOCHROME THEMED ICONS -->
  <g transform="translate(60, 400)">
    <rect width="880" height="240" rx="16" fill="#0C111C" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="34" fill="#A5B4FC" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">ANDROID 13+ MATERIAL YOU MONOCHROME DYNAMIC THEMED</text>

    <!-- 1. 64dp Themed -->
    <g transform="translate(48, 65)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-64)">
          <use href="#dp-icon-mono"/>
        </g>
      </g>
      <text x="32" y="85" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="32" y="105" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">64dp</text>
      <text x="32" y="122" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle">themed grid</text>
    </g>

    <!-- 2. 48dp Themed -->
    <g transform="translate(240, 75)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-48)">
          <use href="#dp-icon-mono" transform="scale(0.75)"/>
        </g>
      </g>
      <text x="24" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="24" y="95" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">48dp</text>
      <text x="24" y="112" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle">themed home</text>
    </g>

    <!-- 3. 32dp Themed -->
    <g transform="translate(430, 85)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-squircle-32)">
          <use href="#dp-icon-mono" transform="scale(0.5)"/>
        </g>
      </g>
      <text x="16" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="16" y="85" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">32dp</text>
      <text x="16" y="102" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle">drawer item</text>
    </g>

    <!-- 4. 24dp Themed -->
    <g transform="translate(610, 89)">
      <g filter="url(#icon-elevation)">
        <g clip-path="url(#dp-circle-24)">
          <use href="#dp-icon-mono" transform="scale(0.375)"/>
        </g>
      </g>
      <text x="12" y="61" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">CabinRTA</text>
      <text x="12" y="81" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">24dp</text>
      <text x="12" y="98" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle">status chip</text>
    </g>

    <!-- Stencil Callout -->
    <g transform="translate(740, 50)" font-family="sans-serif" font-size="11">
      <rect width="110" height="150" rx="8" fill="#131B29" stroke="#1E293B"/>
      <text x="55" y="24" fill="#A5B4FC" font-weight="700" text-anchor="middle">STENCIL</text>
      <text x="12" y="48" fill="#CBD5E1">Gap: <tspan fill="#A5B4FC" font-weight="700">3.8dp</tspan></text>
      <text x="12" y="70" fill="#CBD5E1">Zero Bleed: <tspan fill="#00E676" font-weight="700">✓</tspan></text>
      <text x="12" y="92" fill="#CBD5E1">Monet Tint: <tspan fill="#A5B4FC" font-weight="700">100%</tspan></text>
      <text x="12" y="114" fill="#CBD5E1">Single Fill: <tspan fill="#00E676" font-weight="700">✓</tspan></text>
      <text x="12" y="136" fill="#00E676" font-weight="600">✓ Pure Vector</text>
    </g>
  </g>
</svg>
